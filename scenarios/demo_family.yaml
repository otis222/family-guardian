#
# 用途：Phase 1 驗收（offline 跑完不報錯），之後當 Phase 2、3 的開發劇本。
# 寫法守則（CLAUDE.md、SPEC 第 7 節）：
# - 詐騙訊息只改寫 165 公開宣導過的手法，而且寫得抽象，不寫成可以直接拿去用的話術。
# - 詐騙網址一律用保留給範例的 .example 網域，不放任何真實網址。
# - 時間要帶時區，而且依時間排序。
