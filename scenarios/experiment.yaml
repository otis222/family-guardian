#
# 寫法守則（CLAUDE.md、SPEC 第 7 節）：
# - 詐騙訊息只改寫 165 公開宣導過的手法，而且寫得抽象，不寫成可以直接拿去用的話術。
# - 詐騙網址一律用保留給範例的 .example 網域，不放任何真實網址。
#
# 標註答案（只給評估用，引擎看不到）：
# - label：normal｜scam｜injection。injection 都夾帶詐騙內容，攻擊的目的是讓系統不要提醒。
# - technique：五種手法，各 4 則 scam（SPEC 11-1）。
# - compare：模型比較用的 30 則（SPEC 11-1）。
# 刻意安排（用 python -m guardian.experiment 可以看到各做法的差異）：
# - 規則抓得到（候選）、只到觀察區間、規則完全抓不到的詐騙都有。
# - 家人提醒大家注意、真的要匯款給家人這類「長得像、其實是日常」的訊息，用來量誤報。
# - 週三晚上和週日下午各有一波幾秒內的連續轉傳，用來看批次處理。
# - blocklist 是模擬的 165 名單（真實名單不會有 .example）。

name: 實驗劇本：一週的家族群組
